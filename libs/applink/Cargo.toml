[package]
name = "applink"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "applink's client in Rust (tokio): npf's local apps use npf's sessions (services, channels, media streams)"

[dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.44", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tokio = { version = "1.44", features = ["process", "rt-multi-thread"] }
